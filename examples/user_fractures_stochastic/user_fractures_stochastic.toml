# User fractures + stochastic: the cube of "Box west -> east" with one large
# user-defined fracture in the region box (an octagon of about 14 x 8 m in
# the plane y = 5: the normal +y) across the cube from west to east, and a
# stochastic family which crosses it. The user fracture has a larger
# aperture: most of the flow goes through it.

[boundaries]
inflow = ["west"]
outflow = ["east"]

[network]
seed = 6
min_feature_size = 0.4
domain = "Box.vtu"
orientation_option = "theta_phi"
number_of_points = 8

[network.generation]
n_poly = 5

[network.mesh]
max_size_factor = 5.0
slope = 0.5

[network.clusters]
keep_only_largest = true

[[network.family]]
probability = 1.0
aspect_ratio = 1.0
aperture = { distribution = "constant", value = 1e-4 }
radius = { distribution = "truncated_power_law", alpha = 1.6, min = 2.0, max = 5.0 }
orientation = { theta = 0.0, phi = 0.0, kappa = 0.1 }

[[network.user_fracture]]
region = "box"
center = [5.0, 5.0, 5.0]
radius = 7.78
aspect_ratio = 0.545
beta = 0.0
aperture = 3e-4
orientation = { theta = 90.0, phi = 90.0 }

[flow]
temperature = 20.0
gravity = false
pressure = { west = 10.1, east = 10.0 }

[transport]
seed = 12345
time_unit = "days"
porosity = 1.0
max_time_steps = 1000000
routing = "complete_mixing"

[transport.seeding]
method = "uniform_per_line"
particles_per_line = 3
weight_by_flux = false
