# Box west -> east: the simplest workflow. One family of fractures in a
# cube of 10 m (the Box shape). Each face of the cube is a boundary
# surface: west (x = 0) is the in-flow, east (x = 10) the out-flow, and
# south, north, bottom and top are no-flow surfaces. The flow goes from
# west (10.1 MPa) to east (10.0 MPa). The particles start on the in-flow
# lines and leave at east.

[boundaries]
inflow = ["west"]
outflow = ["east"]

[network]
seed = 1
min_feature_size = 0.4
domain = "Box.vtu"

[network.generation]
n_poly = 50
force_large_fractures = false
remove_fractures_less_than = 0.0

[network.fram]
enable = true
relaxed = false
triple_intersections = true
check_user_fractures = false
write_rejected_fractures = false
rejects_per_fracture = 10

[network.mesh]
max_size_factor = 5.0
slope = 0.5

[network.clusters]
keep_only_largest = true

[[network.family]]
number_of_points = 8
probability = 1.0
aspect_ratio = 1.0
aperture = { distribution = "constant", value = 1e-4 }
radius = { distribution = "truncated_power_law", alpha = 1.6, min = 2.5, max = 6.0 }
orientation = { theta = 0.0, phi = 0.0, kappa = 0.1 }

[flow]
temperature = 20.0
gravity = false
pressure = { west = 10.1, east = 10.0 }

[transport]
seed = 12345
time_unit = "days"
porosity = 1.0
max_time_steps = 1000000
routing = "complete_mixing"

[transport.seeding]
method = "uniform_per_line"
particles_per_line = 3
weight_by_flux = false
