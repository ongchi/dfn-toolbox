# L shape north -> east: an L-shaped domain (the L-shape) of 4 boxes: the
# west, middle and east boxes along x (y 20 to 25), and the north box at
# +y of the west box (x 10 to 15, y 25 to 30). The regions are west_box,
# east_box and other_boxes (the middle and the north box). The end face of
# the north box (y = 30) is the boundary surface north, the end face of the
# east box (x = 25) the boundary surface east. One family in each region:
# the region gives only the fracture centers. The fractures are cut only at
# the mesh surface, thus they connect the regions. The flow goes through
# the L from north (10.1 MPa) to east (10.0 MPa), with gravity; the
# particles leave at east.

[network]
seed = 376
min_feature_size = 0.3
domain = "L-shape.vtu"

[network.generation]
n_poly = 100
force_large_fractures = false
remove_fractures_less_than = 0.0

[network.fram]
enable = true
relaxed = false
triple_intersections = true
check_user_fractures = false
write_rejected_fractures = false
rejects_per_fracture = 10

[network.mesh]
max_size_factor = 5.0
slope = 0.5

[network.clusters]
keep_only_largest = true
keep_isolated_fractures = false

[[network.family]]
number_of_points = 8
probability = 0.3333333333333333
aspect_ratio = 1.0
region = "west_box"
aperture = { distribution = "log_normal", log_mean = -9.0, sd = 0.3 }
radius = { distribution = "truncated_power_law", alpha = 1.6, min = 1.5, max = 5.0 }
orientation = { theta = 0.0, phi = 0.0, kappa = 0.1 }

[[network.family]]
number_of_points = 8
probability = 0.3333333333333333
aspect_ratio = 1.0
region = "east_box"
aperture = { distribution = "log_normal", log_mean = -9.0, sd = 0.3 }
radius = { distribution = "truncated_power_law", alpha = 1.6, min = 1.5, max = 5.0 }
orientation = { theta = 0.0, phi = 0.0, kappa = 0.1 }

[[network.family]]
number_of_points = 8
probability = 0.3333333333333333
aspect_ratio = 1.0
region = "other_boxes"
aperture = { distribution = "log_normal", log_mean = -9.0, sd = 0.3 }
radius = { distribution = "truncated_power_law", alpha = 1.6, min = 1.5, max = 5.0 }
orientation = { theta = 0.0, phi = 0.0, kappa = 0.1 }

[flow]
temperature = 20.0
gravity = true
pressure = { north = 10.1, east = 10.0 }

[transport]
seed = 12345
time_unit = "days"
porosity = 1.0
max_time_steps = 1000000
inflow = ["north"]
outflow = ["east"]
routing = "complete_mixing"

[transport.seeding]
method = "uniform_per_line"
particles_per_line = 3
weight_by_flux = false

[transport.output]
trajectories = true
all_particles = false
velocities = false
