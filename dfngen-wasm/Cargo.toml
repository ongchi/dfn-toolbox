[package]
name = "dfngen-wasm"
version = "0.1.0"
description = "WebAssembly bindings of dfngen for the web app"
edition = "2021"
license = "LGPL-3.0"
publish = false

# Not a member of a workspace of the root crate
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dfngen-rs = { path = "../..", default-features = false }
js-sys = "0.3.106"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
wasm-bindgen = "=0.2.129"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[lints.clippy]
uninlined_format_args = "warn"
needless_pass_by_value = "warn"
explicit_iter_loop = "warn"
redundant_else = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
cast_possible_wrap = "warn"
